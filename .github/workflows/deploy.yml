# Every push to main: test, build, push images to GHCR, pull them on the server.
# A failing test stops the run before deploy, so the broken version never goes live.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"
  REGISTRY: ghcr.io

jobs:
  api:
    name: API (test + release build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p nullbox-api
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: api
          path: target/release/nullbox-api
          retention-days: 3

  web:
    name: Web (test + build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Build (same-origin API behind Caddy)
        run: pnpm build
        env:
          VITE_API_BASE_URL: ""
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: web
          path: apps/web/dist
          retention-days: 3

  deploy:
    name: Deploy
    needs: [api, web]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      SSH_HOST: team-10.fasthacks.cloud
      SSH_USER: deploy
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          path: ci-out
      - name: Image names
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "API_IMAGE=$REGISTRY/$owner/nullbox-api:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=$REGISTRY/$owner/nullbox-web:${GITHUB_SHA}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push images
        run: |
          mkdir -p ctx/api ctx/web
          install -m 755 ci-out/api/nullbox-api ctx/api/
          cp -r ci-out/web ctx/web/dist && cp Caddyfile ctx/web/
          docker build -f deploy/api.Dockerfile -t "$API_IMAGE" ctx/api
          docker build -f deploy/web.Dockerfile -t "$WEB_IMAGE" ctx/web
          docker push -q "$API_IMAGE"
          docker push -q "$WEB_IMAGE"
      - name: SSH setup
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          # The server's host key (from the team page). If the server is replaced, update it here.
          echo "$SSH_HOST ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIK3JIUIYmlDex5OGE1kGJfW3esyL2p/75jskP2jzITM9" > ~/.ssh/known_hosts
      - name: Pull and restart on the server
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scp -i ~/.ssh/deploy compose.yaml "$SSH_USER@$SSH_HOST:nullbox/compose.yaml"
          # The job's own token can pull this repo's packages; it expires with the job.
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy "$SSH_USER@$SSH_HOST" \
            "API_IMAGE='$API_IMAGE' WEB_IMAGE='$WEB_IMAGE' ACTOR='${{ github.actor }}' bash -s" <<'REMOTE'
          set -euo pipefail
          token="$(cat)"
          cd ~/nullbox
          # Record the running version in .env, so a plain `docker compose up -d` keeps it.
          sed -i '/^API_IMAGE=/d;/^WEB_IMAGE=/d' .env
          printf 'API_IMAGE=%s\nWEB_IMAGE=%s\n' "$API_IMAGE" "$WEB_IMAGE" >> .env
          printf '%s' "$token" | docker login ghcr.io -u "$ACTOR" --password-stdin >/dev/null
          trap 'docker logout ghcr.io >/dev/null' EXIT
          docker compose pull -q
          docker compose up -d --no-build --wait --wait-timeout 90
          docker image prune -af --filter until=24h >/dev/null || true
          REMOTE
      - name: Smoke test
        run: |
          for i in $(seq 1 20); do
            curl -fsS "https://$SSH_HOST/api/healthz" | grep -q '"ok"' && exit 0
            sleep 3
          done
          echo "healthz never answered ok" >&2; exit 1
